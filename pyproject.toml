[project]
name = "iot-sandbox"
version = "0.1.0"
description = "Django backend for IoT device payload ingestion"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "psycopg[binary]>=3.2",
    "django-redis>=5.4",
    "redis>=5.0",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "Faker>=25.0",
    "django-test-plus>=2.2",
    "black>=24.0",
    "pylint>=3.1",
    "pylint-django>=2.6",
    "pre-commit>=3.7",
    "django-types>=0.20",
    "djangorestframework-types>=0.8",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pylint.main]
load-plugins = ["pylint_django"]
django-settings-module = "config.settings"
ignore = [".venv", "migrations"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
# Defaults (i, j, k, ex, Run, _) plus the two external-contract field names
# (fCnt, devEUI) that are spec-mandated and used throughout the codebase.
good-names = ["i", "j", "k", "ex", "Run", "_", "fCnt", "devEUI"]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "redefined-outer-name",
    "too-many-ancestors",  # inherent to django-test-plus's TestCase/APITestCase hierarchy
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
exclude = ["**/migrations", ".venv", "**/__pycache__"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
